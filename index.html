.product-modal {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-height: 100vh;
  overflow-y: auto;
  padding: 20px;
  -webkit-overflow-scrolling: touch; /* для iPhone */
}

/* Крестик закрытия */
.product-modal .close-btn,
#product-modal button[onclick="closeProductModal()"] {
  position: absolute;
  top: 10px;
  right: 12px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(4px);
  border: none;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  z-index: 200;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}
.product-modal .close-btn:hover,
#product-modal button[onclick="closeProductModal()"]:hover {
  background: rgba(0, 0, 0, 0.1);
}

/* Кнопка "Добавить в корзину" */
.add-to-cart-btn,
#product-modal .add-to-cart-btn,
#product-modal button[onclick="addToCart()"] {
  position: sticky;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  padding: 12px 0;
  font-weight: 600;
  font-size: 15px;
  text-align: center;
  background: black;
  color: white;
  border: none;
  cursor: pointer;
  z-index: 150;
  border-radius: 0;
  transition: background 0.2s ease;
}
.add-to-cart-btn:hover {
  background: #222;
}

/* Галерея товара */
.product-gallery {
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
  margin: 0 auto;
  padding: 0 4px;
  max-width: 100%;
}

/* Левая колонка миниатюр */
.product-thumbnails {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 56px;
  flex-shrink: 0;
  overflow-y: auto;
  max-height: 85vh;
  scrollbar-width: thin;
  padding-right: 2px;
}

/* Миниатюры */
.product-thumbnails img {
  width: 100%;
  aspect-ratio: 1/1;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s ease, transform 0.2s ease;
  object-fit: cover;
}
.product-thumbnails img:hover {
  opacity: 1;
  transform: scale(1.03);
}
.active-thumb {
  opacity: 1 !important;
  border: 2px solid black;
}

/* Главное фото */
.product-main-image {
  flex: 1;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 400px;
}

.product-main-image img {
  width: 100%;
  height: auto;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 12px;
}

/* Крестик */
#product-modal button[onclick="closeProductModal()"] {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(255, 255, 255, 0.7);
  border: none;
  border-radius: 50%;
  font-size: 20px;
  width: 30px;
  height: 30px;
  line-height: 1;
  z-index: 200;
}

/* Кнопка добавить в корзину */
.add-to-cart-btn {
  position: sticky;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  padding: 10px 0;
  font-weight: 600;
  font-size: 14px;
  background: black;
  color: white;
  border: none;
  border-radius: 0;
  cursor: pointer;
  z-index: 150;
  transition: background 0.2s ease;
}
.add-to-cart-btn:hover {
  background: #222;
}

/* Адаптация под узкие экраны */
@media (max-width: 480px) {
  .product-gallery {
    gap: 6px;
  }

  .product-thumbnails {
    width: 50px;
    gap: 4px;
  }

  .product-main-image img {
    max-height: 80vh;
  }

  #product-modal button[onclick="closeProductModal()"] {
    width: 26px;
    height: 26px;
    font-size: 18px;
    top: 6px;
    right: 6px;
  }
}

  .add-to-cart-btn,
  #product-modal .add-to-cart-btn {
    padding: 10px 0;
    font-size: 14px;

/* make modal details respect \n as paragraphs */
#modal-details {
  white-space: pre-line;

    // ====== Сохранение / загрузка корзины в localStorage ======
    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function loadCart() {
        const stored = localStorage.getItem('cart');
        if (!stored) {
            cart = [];
            return;
        }
        try {
            cart = JSON.parse(stored);
            // убираем физические дубли (склеиваем одинаковые позиции по id+size)
            const unique = [];
            cart.forEach(it => {
                const exist = unique.find(u => u.id === it.id && u.size === it.size);
                if (exist) {
                    exist.quantity = (exist.quantity || 0) + (it.quantity || 0);
                } else {
                    unique.push({ ...it });
                }
            });
            cart = unique;
        } catch (e) {
            console.error('Ошибка чтения cart из localStorage', e);
            cart = [];
        }
    }

    // ====== Инициализация ======
    function init() {
        renderProducts();
        loadCart();
        updateCartCount();
        updateCart();
        // защитим форму от двойного назначения обработчика:
        const orderForm = document.getElementById('order-form');
        if (orderForm) {
            // удаляем inline-обработчик, если он есть
            orderForm.removeAttribute('onsubmit');
            // удаляем предыдущие слушатели на случай, если скрипт подключался несколько раз
            orderForm.removeEventListener && orderForm.removeEventListener('submit', submitOrder);
            orderForm.addEventListener('submit', submitOrder);
        }
    }

    // ====== Рендер товаров (как было) ======
    function renderProducts() {
        const grid = document.getElementById('products-grid');
        if (!grid) return;
        grid.innerHTML = products.map(product => `
            <div class="cursor-pointer group" onclick="openProductModal(${product.id})">
                <div class="relative overflow-hidden rounded-lg product-card-image">
                    <img src="${product.images[0]}" alt="${product.title}" 
                         class="w-full h-full object-cover transition-transform duration-300">
                </div>
                <div class="mt-1">
                    <h3 class="font-semibold text-sm sm:text-base">${product.title}</h3>
                    <p class="text-gray-600 text-sm sm:text-base">${product.price}₽</p>
                </div>
            </div>
        `).join('');
    }

    // ====== Модал товара (как было) ======
    function openProductModal(productId) {
  selectedProduct = products.find(p => p.id === productId);
  selectedSize = null;
  if (!selectedProduct) return;

  document.getElementById('modal-title').textContent = selectedProduct.title;
  document.getElementById('modal-price').textContent = `${selectedProduct.price}₽`;
  // Заменяем буквальные "\n" в данных на реальные переносы строки, затем выводим
document.getElementById('modal-details').textContent = String(selectedProduct.details).replace(/\\n/g, '\n');


  const imageContainer = document.querySelector('.modal-image-container');
  if (imageContainer) {
    imageContainer.innerHTML = `
      <div class="product-gallery flex gap-4 w-full justify-center md:justify-start">
        <!-- Превьюшки -->
        <div class="product-thumbnails flex md:flex-col gap-3 w-24 md:w-20 flex-shrink-0">
          ${selectedProduct.images.map((img, index) => `
            <img 
              src="${img}" 
              alt="${selectedProduct.title}" 
              class="w-full rounded-lg cursor-pointer ${index === 0 ? 'active-thumb' : ''}" 
              onclick="changeMainImage(this, '${img}')"
            >
          `).join('')}
        </div>

        <!-- Главное фото -->
        <div class="product-main-image flex-1 rounded-lg overflow-hidden">
          <img id="mainImage" src="${selectedProduct.images[0]}" alt="${selectedProduct.title}" class="w-full h-full object-cover">
        </div>
      </div>
    `;
  }

  const sizeButtons = document.getElementById('size-buttons');
  if (sizeButtons) {
    sizeButtons.innerHTML = selectedProduct.sizes.map(size => `
      <button onclick="selectSize('${size}', this)" 
        class="px-4 py-2 rounded-lg border-2 border-gray-300 bg-black text-white hover:border-black transition-all">
        ${size}
      </button>
    `).join('');
  }

  document.getElementById('product-modal').classList.remove('hidden');
}


    function selectSize(size, button) {
        selectedSize = size;
        document.querySelectorAll('#size-buttons button').forEach(btn => {
            btn.classList.remove('size-selected');
            btn.classList.add('bg-black', 'text-white');
        });
        button.classList.add('size-selected');
        button.classList.remove('bg-black', 'text-white');
    }

    function changeMainImage(el, imgSrc) {
  const main = document.getElementById('mainImage');
  if (main) main.src = imgSrc;
  document.querySelectorAll('.product-thumbnails img').forEach(img => img.classList.remove('active-thumb'));
  el.classList.add('active-thumb');
}


    function closeProductModal() {
        document.getElementById('product-modal').classList.add('hidden');
        selectedProduct = null;
        selectedSize = null;
    }

    // ====== Добавление в корзину (без дублирования) ======
    function addToCart() {
        if (!selectedProduct) return;
        if (!selectedSize) {
            alert('Выберите размер!');
            return;
        }

        const existing = cart.find(item => item.id === selectedProduct.id && item.size === selectedSize);
        if (existing) {
            existing.quantity = (existing.quantity || 0) + 1;
        } else {
            cart.push({
                id: selectedProduct.id,
                title: selectedProduct.title,
                price: selectedProduct.price,
                images: selectedProduct.images,
                size: selectedSize,
                quantity: 1
            });
        }

        saveCart();
        showNotification();
        updateCartCount();
        updateCart();
        closeProductModal();
    }

    // ====== Рендер корзины ======
    function updateCart() {
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');

        if (!cartItems) return;

        if (cart.length === 0) {
            cartItems.innerHTML = '<p class="text-gray-500">Корзина пуста</p>';
            if (cartTotal) cartTotal.textContent = '0₽';
            return;
        }

        cartItems.innerHTML = cart.map(item => `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-3 border-b">
                <div class="flex items-center gap-4 min-w-0 flex-1">
                    <img src="${item.images && item.images[0] ? item.images[0] : ''}" class="w-14 h-14 sm:w-16 sm:h-16 object-cover rounded">
                    <div class="min-w-0">
                        <h4 class="font-semibold truncate">${item.title}</h4>
                        <p class="text-sm text-gray-600 truncate">Размер: ${item.size}</p>
                    </div>
                </div>
                <p class="font-semibold sm:order-none order-3">${item.price * item.quantity}₽</p>
                <div class="flex items-center gap-3 flex-shrink-0 self-end sm:self-auto mt-1 sm:mt-0">
                    <button onclick="changeQuantity(${item.id}, '${item.size}', -1)" class="px-3 py-1 bg-gray-100 rounded">-</button>
                    <span id="qty-${item.id}-${escapeSize(item.size)}">${item.quantity}</span>
                    <button onclick="changeQuantity(${item.id}, '${item.size}', 1)" class="px-3 py-1 bg-gray-100 rounded">+</button>
                    <button onclick="removeItem(${item.id}, '${item.size}')" class="text-red-500 ml-2">×</button>
                </div>
            </div>
        `).join('');

        if (cartTotal) cartTotal.textContent = `${calculateTotal()}₽`;
    }

    // helper to make id-safe for span id
    function escapeSize(size) {
        return String(size).replace(/[^a-zA-Z0-9\-]/g, '_');
    }

    // ====== Обновление счётчика на иконке корзины ======
    function updateCartCount() {
        const cartCount = document.getElementById('cart-count');
        const cartCountMobile = document.getElementById('cart-count-mobile');
        const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
        if (cartCount) cartCount.textContent = totalItems;
        if (cartCountMobile) cartCountMobile.textContent = totalItems;
    }

    // ====== Изменение количества ======
    function changeQuantity(id, size, delta) {
        const item = cart.find(i => i.id === id && i.size === size);
        if (!item) return;

        item.quantity = (item.quantity || 0) + delta;
        if (item.quantity <= 0) {
            // удаляем позицию
            cart = cart.filter(i => !(i.id === id && i.size === size));
        }

        saveCart();
        updateCartCount();
        updateCart();
    }

    // ====== Удаление позиции ======
    function removeItem(id, size) {
        cart = cart.filter(i => !(i.id === id && i.size === size));
        saveCart();
        updateCartCount();
        updateCart();
    }

    // ====== Подсчёт итога ======
    function calculateTotal() {
        return cart.reduce((sum, item) => sum + (item.price * (item.quantity || 0)), 0);
    }

    // ====== Уведомление о добавлении ======
    function showNotification() {
        const notification = document.getElementById('notification');
        if (!notification) return;
        notification.classList.remove('hidden');
        notification.style.animation = 'none';
        setTimeout(() => notification.style.animation = '', 10);
        setTimeout(() => notification.classList.add('hidden'), 2500);
    }

    // ====== Модалки ======
    function toggleCartModal() {
        const cartModal = document.getElementById('cart-modal');
        if (!cartModal) return;
        cartModal.classList.toggle('hidden');
        if (!cartModal.classList.contains('hidden')) {
            // при открытии модалки подгружаем актуальную корзину
            updateCart();
            updateCartCount();
        }
    }

    function toggleCheckoutModal() {
        const checkout = document.getElementById('checkout-modal');
        if (!checkout) return;
        checkout.classList.toggle('hidden');
    }

    // ====== Отправка заказа в Telegram (submit) ======
    async function submitOrder(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);

        const deliveryText = formData.get('delivery') === 'pickup' ? 'Самовывоз (бесплатно)' :
                             formData.get('delivery') === 'courier' ? 'Курьер (+500₽)' : 'Неизвестно';

        const paymentText = formData.get('payment') === 'card' ? 'Картой онлайн' :
                            formData.get('payment') === 'cash' ? 'Наложенный платеж' : 'Неизвестно';

        const order = {
            name: formData.get('name'),
            phone: formData.get('phone'),
            email: formData.get('email'),
            telegram: formData.get('telegram'),
            delivery: deliveryText,
            payment: paymentText,
            cart: cart,
            total: calculateTotal()
        };

        if (!order.cart || order.cart.length === 0) {
            alert('Корзина пуста. Добавьте товар перед оформлением.');
            return;
        }

        // ====== ВАЖНО: ПОДСТАВЬ СВОИ ДАННЫЕ ======
        const TOKEN = "8102485605:AAH78Zk3vlZk9M2XQJtb-4nVEgEnjmgPYjk";
        const CHAT_ID = "-1003299895690";
        const URL = `https://api.telegram.org/bot8102485605:AAH78Zk3vlZk9M2XQJtb-4nVEgEnjmgPYjk/sendMessage`;
        // Формируем сообщение
        let message = `<b>🛍 Новый заказ с сайта WhyNotClothes</b>\n\n`;
        message += `<b>👤 Имя:</b> ${order.name}\n`;
        message += `<b>📞 Телефон:</b> ${order.phone}\n`;
        message += `<b>📧 Email:</b> ${order.email}\n`;
        if (order.telegram) message += `<b>💬 Telegram:</b> ${order.telegram}\n`;
        message += `\n<b>🚚 Доставка:</b> ${order.delivery}\n`;
        message += `<b>💳 Оплата:</b> ${order.payment}\n\n`;
        message += `<b>🛒 Товары:</b>\n`;

        order.cart.forEach((item, i) => {
            message += `${i + 1}. ${item.title} (${item.size}) — ${item.quantity} шт. × ${item.price}₽ = ${item.quantity * item.price}₽\n`;
        });

        message += `\n<b>💰 Итого:</b> ${order.total}₽`;

        try {
            const response = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            });

            if (response.ok) {
                alert('✅ Заказ успешно оформлен!');
                cart = [];
                saveCart();
                updateCart();
                updateCartCount();
                toggleCheckoutModal();
                form.reset();
            } else {
                console.error('Telegram send failed:', await response.text());
                alert('Ошибка при отправке в Telegram');
            }
        } catch (error) {
            console.error('Ошибка соединения с Telegram API', error);
            alert('Ошибка соединения с Telegram API');
        }
    }

  function toggleMobileMenu() {
    mobileMenu.classList.toggle("open");
    const spans = hamburger.querySelectorAll("span");
    spans.forEach((span, index) => {
      if (mobileMenu.classList.contains("open")) {
        span.style.transformOrigin = "center";
        if (index === 0) span.style.transform = "rotate(45deg) translateY(7px)";
        if (index === 1) span.style.opacity = "0";
        if (index === 2) span.style.transform = "rotate(-45deg) translateY(-7px)";
      } else {
        span.style.transform = "";
        span.style.opacity = "1";
      }
    });
  }

  hamburger.addEventListener("click", toggleMobileMenu);
